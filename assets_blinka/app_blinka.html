    <!-- The bed of the light theme, not white: this is what the mobile URL bar
         blends into, and the page bed is what meets the top of the viewport.
         Rewritten per theme by src/lib/theme.ts. -->
    <meta name="theme-color" content="#f4f5f7" />

    <!--
      Pre-paint theme. This is the one piece that cannot be a React component:
      by the time any component mounts the browser has already painted, so
      without this a reader who chose dark gets a full white flash on every
      single load. Blocking and inline on purpose.

      Kept deliberately tiny, and it duplicates four constants from
      src/lib/theme.ts because a module cannot be imported here.
      test/theme-prepaint.test.ts asserts the two agree; the failure mode if
      they drift is silent, since React then applies the right class a moment
      later and everything looks correct except the flash.

      The stored value is a BARE string. JSON.stringify would write `"dark"`
      with quotes and this comparison would never match.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('blinka.web.theme');
          var theme =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'light';
          var dark =
            theme === 'dark' ||
            (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f1013');
          } else {
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {
          // Private-mode Safari throws on localStorage. Light is the default.
        }
      })();
    </script>
